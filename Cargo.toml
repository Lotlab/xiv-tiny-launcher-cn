[workspace]
resolver = "2"
members = ["crates/proto", "crates/launcher", "crates/sdologinentry64"]

[workspace.package]
version = "0.1.0"
edition = "2021"
authors = ["xiv-tiny-launcher-cn"]
description = "FFXIV CN (SDO) tiny launcher: self-made EXE + game-side sdologinentry64.dll"
license = "MIT"

[workspace.dependencies]
proto = { path = "crates/proto" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
md-5 = "0.10"
getrandom = "0.4"
png = "0.17"
clap = { version = "4", features = ["derive"] }
reqwest = { version = "0.12", default-features = false, features = ["blocking", "rustls-tls"] }
windows-sys = "0.59"

[profile.release]
opt-level = 2
lto = true
codegen-units = 1
strip = true
